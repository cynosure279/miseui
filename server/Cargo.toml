[package]
name = "miseui-server"
version = "0.1.0"
edition = "2021"
description = "MiseUI middleware: configurable HTTP/WS bridge to the mise CLI"
license = "MIT"
default-run = "miseui-server"

# Standalone project: keep OUT of the parent mise cargo workspace.
[workspace]

[[bin]]
name = "miseui-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
