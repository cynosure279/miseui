name: MiseUI Release

"on":
  push:
    tags:
      - "miseui-v*"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches server version
        run: |
          set -euo pipefail
          tag_ver="${GITHUB_REF_NAME#miseui-v}"
          cargo_ver="$(
            sed -n '/^\[package\]/,/^\[/p' server/Cargo.toml | grep -m1 '^version' | cut -d'"' -f2 || true
          )"
          if [ -z "$cargo_ver" ]; then echo "::error::could not read server version"; exit 1; fi
          if [ "$tag_ver" != "$cargo_ver" ]; then
            echo "::error::tag v$tag_ver != server version $cargo_ver"
            exit 1
          fi
          echo "verified: v$tag_ver"

  build-linux:
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
        with: { key: miseui-linux }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf lintian
      - run: bun install --frozen-lockfile
        working-directory: gui
      - run: bun run build
        working-directory: gui
      - run: bunx tauri build --bundles deb
        working-directory: gui
      - name: Validate deb
        run: |
          set -euo pipefail
          DEB="$(
            find gui/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit
          )"
          [ -n "$DEB" ] || { echo "::error::no deb"; exit 1; }
          dpkg-deb --info "$DEB" | head -8
          lintian --fail-on error "$DEB" || { rc=$?; [ "$rc" -eq 2 ] && echo "warnings only" || exit $rc; }
          PKG="$(dpkg-deb -f "$DEB" Package)"
          sudo dpkg -i "$DEB" && dpkg -s "$PKG" >/dev/null
          BIN="$(dpkg -L "$PKG" | grep '^/usr/bin/' | head -n1)"
          [ -x "$BIN" ] && echo "bin ok: $BIN"
          sudo dpkg -r "$PKG" && echo "uninstall ok"
      - uses: actions/upload-artifact@v4
        with:
          name: miseui-linux
          path: |
            gui/src-tauri/target/release/bundle/deb/*.deb
            gui/dist
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
        with: { key: miseui-macos }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
        working-directory: gui
      - run: bun run build
        working-directory: gui
      - run: bunx tauri build --bundles app,dmg
        working-directory: gui
      - uses: actions/upload-artifact@v4
        with:
          name: miseui-macos
          path: gui/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
        with: { key: miseui-windows }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
        working-directory: gui
      - run: bun run build
        working-directory: gui
      - run: bunx tauri build --bundles nsis
        working-directory: gui
      - uses: actions/upload-artifact@v4
        with:
          name: miseui-windows
          path: gui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-server-image:
    runs-on: ubuntu-latest
    needs: check-version
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/miseui-server
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Build image (load, not push)
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: miseui-server:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container boots
        run: |
          set -euo pipefail
          c="miseui-server-ci-${{ github.run_id }}"
          docker rm -f "$c" >/dev/null 2>&1 || true
          docker run -d --name "$c" -e MISEUI_MISE_BIN=/bin/true miseui-server:ci-check
          trap 'docker rm -f "$c" >/dev/null 2>&1 || true' EXIT
          sleep 3
          docker ps --filter name="$c" | grep -q Up
          echo "container up"
      - name: Push verified image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, build-server-image]
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "miseui-*"
      - run: ls -R artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
