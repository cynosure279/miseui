name: MiseUI Release

# tag miseui-v* 触发：桌面三平台 + Web 静态 + server Docker 镜像
"on":
  push:
    tags:
      - "miseui-v*"

concurrency:
  group: ${ github.workflow }-${ github.ref }
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches server version
        run: |
          set -euo pipefail
          tag_ver="${GITHUB_REF_NAME#miseui-v}"
          cargo_ver="$(sed -n '/^\[package\]/,/^\[/p' server/Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)"
          if [ "$tag_ver" != "$cargo_ver" ]; then
            echo "::error::tag $tag_ver != cargo $cargo_ver"
            exit 1
          fi
          echo "verified :: $tag_ver"

  build-linux:
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf lintian
      - run: bun install --frozen-lockfile
        working-directory: gui
      # 桌面 deb（需 src-tauri 就绪；M4 后启用）+ 仅 web 先产出
      - name: build web
        run: bun run build --prefix gui || bun --cwd gui run build
      - uses: actions/upload-artifact@v4
        with:
          name: miseui-web
          path: gui/dist
          if-no-files-found: error

  build-server-image:
    runs-on: ubuntu-latest
    needs: check-version
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${ github.actor }
          password: ${ secrets.GITHUB_TOKEN }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${ github.repository }/miseui-server
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Build image (load, not push)
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: miseui-server:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify container healthcheck
        run: |
          set -euo pipefail
          c="miseui-server-ci-${ github.run_id }"
          docker rm -f "$c" >/dev/null 2>&1 || true
          docker run -d --name "$c" -e MISEUI_MISE_BIN=/bin/true miseui-server:ci-check
          trap 'docker rm -f "$c" >/dev/null 2>&1 || true' EXIT
          sleep 2
          docker ps --filter name="$c" | grep -q Up
          echo "container up"
      - name: Push verified image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${ steps.meta.outputs.tags }
          labels: ${ steps.meta.outputs.labels }
          cache-from: type=gha

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-server-image]
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "miseui-*"
      - run: ls -R artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
