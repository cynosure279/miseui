name: MiseUI CI

# 适配性增加：仅当 gui/server 变更时运行，不拖慢 mise 主体 CI。
"on":
  push:
    paths: ["gui/**", "server/**"]
    branches: [main, master, develop]
  pull_request:
    paths: ["gui/**", "server/**"]

concurrency:
  group: ${ github.workflow }-${ github.ref }
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 中间件：独立 cargo 工程（不加入 mise workspace），单独构建测试
  miseui-server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${ matrix.os }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: miseui-server-${ matrix.os }
      - name: Install Linux deps (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - name: cargo test (server)
        run: cargo test --manifest-path server/Cargo.toml
      - name: cargo clippy (server)
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings

  # 前端：bun 工具链（与宿主仓库一致），typecheck + 构建
  miseui-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: bun install
        working-directory: gui
        run: bun install --frozen-lockfile
      - name: typecheck / lint
        working-directory: gui
        run: bun run typecheck
      - name: build web static
        working-directory: gui
        run: bun run build

  # 集成：前端产物 + server（fake-mise）全链路
  miseui-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@v2
        with: { key: miseui-integration }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
        working-directory: gui
      - name: server integration tests incl. fake-mise
        run: cargo test --manifest-path server/Cargo.toml -- --nocapture
      - name: build web
        run: bun run build
        working-directory: gui
